<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Acrylic Glow Effect with Controls</title>
  <style>
    :root {
      /* Dynamic blur value controlled by JS */
      --glass-blur: 20px;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* CONTROL PANEL STYLING */
    .controls-container {
      position: absolute;
      top: 30px;
      z-index: 10;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 15px 25px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .color-pickers {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 14px;
    }

    .color-pickers input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .toggle-btn {
      background: #0078d4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }
    
    .toggle-btn:hover {
      background: #106ebe;
    }

    /* THE BACKGROUND LAYER */
    .color-source-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      display: flex;
      justify-content: space-around;
      filter: blur(80px) saturate(350%);
      z-index: 1;
    }

    /* The three color blocks */
    .block {
      width: 140px;
      height: 140px;
      border-radius: 10px;
      transition: background-color 0.1s linear;
    }

    /* THE WINDOWS ACRYLIC OVERLAY (Cleaned up, no interior detail lines) */
    .acrylic-panel {
      position: relative;
      z-index: 2;
      width: 650px;
      height: 250px;
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      
      /* Uses the CSS variable for reliable rendering */
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="controls-container">
    <!-- Color Pickers -->
    <div class="color-pickers">
      <label>Colors: </label>
      <input type="color" id="picker1" value="#7296f6" oninput="updateColors()">
      <input type="color" id="picker2" value="#138a4c" oninput="updateColors()">
      <input type="color" id="picker3" value="#f76868" oninput="updateColors()">
    </div>
    
    <!-- Working Toggle Button -->
    <button class="toggle-btn" id="blurToggle" onclick="toggleBlur()">Hide Blur Layer</button>
  </div>

  <!-- Underneath glowing layer -->
  <div class="color-source-layer">
    <div id="block1" class="block" style="background-color: #7296f6;"></div>
    <div id="block2" class="block" style="background-color: #138a4c;"></div>
    <div id="block3" class="block" style="background-color: #f76868;"></div>
  </div>

  <!-- Top-level translucent menu grid (Completely empty for a clean sheet) -->
  <div class="acrylic-panel"></div>

  <!-- JavaScript Controls and Fixes -->
  <script>
    // State management tracking if blur is active
    let isBlurActive = true;

    function toggleBlur() {
      const btn = document.getElementById('blurToggle');
      
      if (isBlurActive) {
        // Turn blur OFF by setting the CSS variable to 0px
        document.documentElement.style.setProperty('--glass-blur', '0px');
        btn.textContent = 'Show Blur Layer';
        isBlurActive = false;
      } else {
        // Turn blur ON by resetting the value back to 20px
        document.documentElement.style.setProperty('--glass-blur', '20px');
        btn.textContent = 'Hide Blur Layer';
        isBlurActive = true;
      }
    }

    function updateColors() {
      // Fetch input values
      const c1 = document.getElementById('picker1').value;
      const c2 = document.getElementById('picker2').value;
      const c3 = document.getElementById('picker3').value;

      // Map color pickers immediately to background block colors
      document.getElementById('block1').style.backgroundColor = c1;
      document.getElementById('block2').style.backgroundColor = c2;
      document.getElementById('block3').style.backgroundColor = c3;
    }
  </script>

</body>
</html>
